[project]
name = "jtraskas-io"
version = "0.1.0"
description = "Project scripts for the jtraskas.io blog, run via uv"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
init = "scripts.init:main"
clean = "scripts.clean:main"
start = "scripts.start:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
