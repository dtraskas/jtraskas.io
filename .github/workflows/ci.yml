name: Blog CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Required for the GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, without cancelling a run already in progress
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BASE_PATH: /jtraskas.io
  NEXT_PUBLIC_SITE_URL: https://jtraskas.github.io/jtraskas.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: npm ci
    - run: npm run build
    # Jekyll would otherwise skip the _next directory
    - run: touch out/.nojekyll
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
